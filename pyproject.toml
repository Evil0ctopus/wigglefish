[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wigglefish"
version = "0.1.0"
description = "Passive Wi-Fi/BLE field scanner metadata tools for ESP32-C5 + Android."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
wigglefish = "wigglefish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
